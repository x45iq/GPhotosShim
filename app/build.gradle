plugins {
    id 'com.android.application'
}

// Release signing is read from local.properties (not committed):
//   RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def hasReleaseSigning = localProperties['RELEASE_STORE_FILE'] != null

android {
    namespace 'com.google.android.apps.photos'
    compileSdk 37
    compileSdkMinor 2

    defaultConfig {
        applicationId 'com.google.android.apps.photos'
        minSdk 29
        targetSdk 37
        versionCode 6
        versionName '1.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(localProperties['RELEASE_STORE_FILE'])
                storePassword localProperties['RELEASE_STORE_PASSWORD']
                keyAlias localProperties['RELEASE_KEY_ALIAS']
                keyPassword localProperties['RELEASE_KEY_PASSWORD']

                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            // AGP 9.3+ optimization DSL: enables R8 code shrinking and resource shrinking
            optimization {
                enable = true
            }
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}
